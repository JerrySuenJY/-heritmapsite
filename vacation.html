<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Heritmap — Submit a Story</title>
  <style>
    body { margin: 0; background: #000; color: #fff; font-family: 'Times New Roman', Times, serif; }

    /* ✅ Your exact navbar styles */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #333;
      padding: 1rem 2rem;
    }
    .logo img {
      height: 100px;
      transform: scale(2);
      margin-top: -10px;
    }
    .nav-links {
      list-style: none;
      display: flex;
      gap: 1.5rem;
    }
    .nav-links a {
      text-decoration: none;
      color: #fff;
      font-weight: bold;
      transition: color 0.3s ease, transform 0.3s ease;
    }
    .nav-links a:hover {
      color: #ffcc00;
      transform: translateY(-2px);
    }

    /* Layout */
    .wrap { max-width: 980px; margin: 0 auto; padding: 28px 18px 64px; }
    h1 { font-size: clamp(28px, 5vw, 48px); line-height: 1.1; margin: 18px 0 6px; }
    p.lead { color: #9ca3af; margin: 0 0 18px; }

    .panel { background:#111; border:1px solid #222; border-radius:18px; padding:20px; box-shadow:0 10px 24px rgba(0,0,0,.35); }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    @media (max-width:760px){ .row{ grid-template-columns:1fr; } }
    label { font-size:14px; color:#e5e7eb; display:block; margin:10px 0 6px; }
    input, select, textarea { width:100%; padding:12px; border:1px solid #222; border-radius:12px; background:#0d0d0d; color:#fff; outline:none; }
    input:focus, textarea:focus, [contenteditable="true"]:focus { border-color:#444; }

    .toolbar { display:flex; gap:6px; flex-wrap:wrap; border:1px solid #222; border-bottom:none; border-radius:12px 12px 0 0; background:#0d0d0d; padding:8px; }
    .tbtn { border:1px solid #222; background:#141414; color:#e5e7eb; border-radius:10px; padding:6px 9px; cursor:pointer; }
    .editor { min-height:220px; border:1px solid #222; border-top:none; border-radius:0 0 12px 12px; background:#0b0b0b; padding:12px; line-height:1.5; }
    .editor:empty:before { content:attr(data-placeholder); color:#555; }

    .drop { margin-top:8px; border:1px dashed #333; border-radius:14px; padding:18px; text-align:center; color:#9ca3af; }
    .drop.drag { border-color:#777; color:#ddd; }
    .files { display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
    .chip { border:1px solid #222; background:#0f0f0f; border-radius:12px; padding:6px 10px; font-size:13px; }

    .actions { display:flex; gap:10px; align-items:center; margin-top:16px; }
    .btn { appearance:none; border-radius:12px; padding:12px 16px; border:1px solid #222; background:#171717; color:#fff; cursor:pointer; }
    .btn.primary { background:#1f2937; }
    .note { font-size:13px; color:#9ca3af; }

    .alert { margin-top:14px; padding:12px; border-radius:12px; border:1px solid #222; }
    .ok { background:rgba(16,185,129,.1); border-color:rgba(16,185,129,.35); }
    .err { background:rgba(239,68,68,.1); border-color:rgba(239,68,68,.35); }
    .hidden { display:none; }
  </style>
</head>
<body>
  <!-- NAVBAR -->
  <header class="navbar">
    <div class="logo"><a href="/"><img src="/favicon-new.png" alt="Heritmap"/></a></div>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/heritage.html">Heritage</a></li>
      <li><a href="#" style="color:#ffcc00">Submit a Story</a></li>
      <li><a href="/about.html">About</a></li>
    </ul>
  </header>

  <main class="wrap">
    <h1>Submit your cultural story</h1>
    <p class="lead">This portal sends your submission <b>directly and only</b> to: <u>Jerry.SunJingyuan@outlook.com</u>.</p>

    <section class="panel">
      <!-- 📨 Direct-to-email via EmailJS (no alternative routes) -->
      <form id="submitForm" enctype="multipart/form-data" autocomplete="on"
            data-emailjs-service="YOUR_SERVICE_ID"
            data-emailjs-template="YOUR_TEMPLATE_ID"
            data-emailjs-public="YOUR_PUBLIC_KEY">
        <!-- Force recipient -->
        <input type="hidden" name="to_email" value="Jerry.SunJingyuan@outlook.com" />

        <div class="row">
          <div>
            <label for="author">Your name / nickname *</label>
            <input id="author" name="author" required placeholder="e.g., Lin or @ForestNote" />
          </div>
          <div>
            <label for="email">Contact email *</label>
            <input id="email" name="email" type="email" required placeholder="you@example.com" />
          </div>
        </div>

        <div class="row">
          <div>
            <label for="site">Site / Tradition name *</label>
            <input id="site" name="site" required placeholder="e.g., Xuanwu Lake, Nanjing" />
          </div>
          <div>
            <label for="coords">Coordinates (optional)</label>
            <input id="coords" name="coords" placeholder="lat, lon (e.g., 32.0603, 118.7914)" />
          </div>
        </div>

        <label for="title">Submission title *</label>
        <input id="title" name="title" required placeholder="A precise, 6–12 word title" />

        <!-- Rich text editor -->
        <label>Story / field notes *</label>
        <div class="toolbar" role="toolbar" aria-label="Formatting toolbar">
          <button type="button" class="tbtn" data-cmd="bold"><b>B</b></button>
          <button type="button" class="tbtn" data-cmd="italic"><i>I</i></button>
          <button type="button" class="tbtn" data-cmd="underline"><u>U</u></button>
          <button type="button" class="tbtn" data-cmd="insertUnorderedList">• List</button>
          <button type="button" class="tbtn" data-cmd="formatBlock" data-value="h3">H3</button>
          <button type="button" class="tbtn" data-cmd="createLink" data-prompt="Enter URL">Link</button>
          <button type="button" class="tbtn" id="clearBtn">Clear</button>
        </div>
        <div id="editor" class="editor" contenteditable="true" data-placeholder="Write 120–400 words. Include site details, what moved you, any preservation ideas…" aria-label="Story editor"></div>
        <textarea id="story" name="story" class="hidden" required></textarea>

        <!-- Uploads -->
        <label>Attach media (images / PDF, up to 10 MB total)</label>
        <div id="drop" class="drop">Drag & drop files here or click to choose</div>
        <input id="files" name="files" type="file" class="hidden" multiple accept="image/*,.pdf" />
        <div id="fileList" class="files" aria-live="polite"></div>

        <!-- Anti-spam honeypot -->
        <input type="text" name="website" id="website" class="hidden" tabindex="-1" autocomplete="off" />

        <div class="row">
          <div>
            <label for="consent">Usage permission *</label>
            <select id="consent" name="consent" required>
              <option value="">Choose one…</option>
              <option value="Publish on Heritmap">Publish on Heritmap</option>
              <option value="Publish + social media">Publish + Heritmap social media</option>
              <option value="Contact me first">Contact me first</option>
            </select>
          </div>
          <div>
            <label for="lang">Language</label>
            <select id="lang" name="lang">
              <option>English</option>
              <option>中文</option>
            </select>
          </div>
        </div>

        <div class="actions">
          <button class="btn primary" type="submit">Send to Jerry</button>
          <span class="note">You’ll see a green confirmation if the email is sent successfully.</span>
        </div>

        <div id="status" class="alert hidden"></div>
      </form>
    </section>
  </main>

  <!-- EmailJS SDK (client-only delivery to your Outlook address) -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script>
    // Minimal HTML sanitizer
    function sanitizeHtml(html){
      return html.replace(/<script[^>]*>[\s\S]*?<\\/script>/gi, "")
                 .replace(/on\w+\s*=\s*"[^"]*"/gi, "")
                 .replace(/on\w+\s*=\s*'[^']*'/gi, "")
                 .replace(/on\w+\s*=\s*[^\s>]+/gi, "");
    }

    // Toolbar actions
    document.querySelectorAll('.tbtn').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const cmd = btn.dataset.cmd;
        if(cmd==='createLink'){
          const url = prompt(btn.dataset.prompt||'Enter URL');
          if(url) document.execCommand('createLink', false, url);
        } else if(cmd==='formatBlock'){
          document.execCommand('formatBlock', false, btn.dataset.value||'p');
        } else if(btn.id==='clearBtn'){
          document.getElementById('editor').innerHTML = '';
        } else {
          document.execCommand(cmd, false, null);
        }
      })
    })

    // Dropzone + file input
    const drop = document.getElementById('drop');
    const fileInput = document.getElementById('files');
    const fileList = document.getElementById('fileList');

    function refreshFileChips(files){
      fileList.innerHTML='';
      [...files].forEach(f=>{
        const div = document.createElement('div');
        div.className='chip';
        div.textContent = `${f.name} — ${(f.size/1024/1024).toFixed(2)} MB`;
        fileList.appendChild(div);
      })
    }

    drop.addEventListener('click', ()=> fileInput.click());
    drop.addEventListener('dragover', e=>{ e.preventDefault(); drop.classList.add('drag'); });
    drop.addEventListener('dragleave', ()=> drop.classList.remove('drag'));
    drop.addEventListener('drop', e=>{
      e.preventDefault(); drop.classList.remove('drag');
      if(e.dataTransfer.files?.length){
        fileInput.files = e.dataTransfer.files;
        refreshFileChips(fileInput.files);
      }
    });
    fileInput.addEventListener('change', ()=> refreshFileChips(fileInput.files));

    // EmailJS send
    const form = document.getElementById('submitForm');
    const statusBox = document.getElementById('status');
    const editor = document.getElementById('editor');
    const storyField = document.getElementById('story');

    function showStatus(msg, ok=true){
      statusBox.className = `alert ${ok? 'ok':'err'}`;
      statusBox.textContent = msg;
      statusBox.classList.remove('hidden');
    }

    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      if(document.getElementById('website').value){ return; } // honeypot

      const html = sanitizeHtml(editor.innerHTML.trim());
      if(!html){ showStatus('Please write your story before submitting.', false); return; }
      storyField.value = html;

      // Size check (<=10MB total)
      const files = fileInput.files || [];
      let total = 0; [...files].forEach(f=> total += f.size);
      if(total > 10*1024*1024){ showStatus('Total file size exceeds 10 MB. Please remove some files.', false); return; }

      const serviceID = form.dataset.emailjsService;
      const templateID = form.dataset.emailjsTemplate;
      const publicKey = form.dataset.emailjsPublic;
      if(!serviceID || !templateID || !publicKey){ showStatus('Email configuration missing. Ask the site owner to set keys.', false); return; }

      emailjs.init({ publicKey });
      try{
        await emailjs.sendForm(serviceID, templateID, form); // delivers to to_email only
        showStatus('Sent! Thank you for contributing to Heritmap.');
        form.reset(); editor.innerHTML = ''; fileList.innerHTML='';
      }catch(err){ console.error(err); showStatus('Sending failed. Please try again.', false); }
    });
  </script>

  <!--
    CONFIG (one-time):
    1) EmailJS → create Service (Gmail/Outlook) = YOUR_SERVICE_ID
    2) EmailJS → create Template = YOUR_TEMPLATE_ID with fields: to_email, author, email, site, coords, title, story, consent, lang
       - Set Template recipient to {{to_email}} or directly to Jerry.SunJingyuan@outlook.com
       - Enable attachments in the template so sendForm() forwards uploaded files
    3) Account → API Keys → YOUR_PUBLIC_KEY
    4) Replace the three placeholders in the <form> dataset above.

    Result: submissions go ONLY to Jerry.SunJingyuan@outlook.com, from the website, with optional attachments.
  -->
</body>
</html>
