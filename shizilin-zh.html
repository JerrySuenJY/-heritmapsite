<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>獅子林 – Heritmap</title>
<style>
  :root{
    --card-radius: 22px;
    --page-max: 1100px;
    --gap: 1.25rem;
    --bg: #f7f7f7;
    --surface: #ffffff;
    --text: #141414;
    --muted: #666;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    color: var(--text);
    background: var(--bg);
    font-family: "Times New Roman", serif;
  }

  .page {
    max-width: var(--page-max);
    margin: 0 auto;
    padding: 24px 16px 56px;
  }

  .hero {
    display: grid;
    justify-items: center;
    text-align: center;
    gap: 16px;
    margin-bottom: 28px;
  }

  .hero-media {
    width: min(100%, 820px);
    aspect-ratio: 16/9;
    overflow: hidden;
    border-radius: var(--card-radius);
    background: #ddd;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
  }
  .hero-media img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .hero-title{
    font-size: clamp(28px, 5vw, 44px);
    line-height: 1.1;
    margin: 0;
    letter-spacing: 0.2px;
  }
  .hero-intro{
    max-width: 780px;
    font-size: clamp(15px, 2.4vw, 18px);
    color: var(--muted);
    margin: 6px 0 0;
  }

  .submissions {
    display: block;
    column-count: 3;
    margin-top: 28px;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: var(--gap);
    align-items: start;
  }

  .submissions .card {
    display: inline-block;
    width: 100%;
    margin: 0 0 28px;                  
    break-inside: avoid;
    -webkit-column-break-inside: avoid;
    -moz-column-break-inside: avoid;
  }

  .card {
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border-radius: var(--card-radius);
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
    overflow: hidden; 
    min-height: 280px;
    text-align: center;
  }

  .card-media{
    width: 100%;
    aspect-ratio: 4/3;
    overflow: hidden;
    background: #e9e9e9;
  }
  .card-media img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .card-body{
    display: grid;
    grid-template-rows: auto 1fr auto; 
    padding: 14px 14px 16px;
    gap: 8px;
  }

  .card-title{
    margin: 2px 0 0;
    font-size: 1.25rem; 
    line-height: 1.2;
    letter-spacing: .2px;
  }

  .card-meta{
    font-size: .85rem;
    color: var(--muted);
  }

  .card-intro{
    margin: 0;
    padding-top: 6px;
    font-size: .98rem; 
    color: var(--muted);
  }

  .card.no-image .card-body{
    padding-top: 18px;
  }

  .clamp-3 {
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .return-home {
    display: inline-block;
    margin-top: 10px;
    margin-bottom: 18px;
    font-size: 0.95rem;
    color: #444;
    text-decoration: none;
    transition: color 0.2s ease;
  }

  .return-home:hover {
    color: #000;
    text-decoration: underline;
  }
</style>
</head>
<body>
  <main class="page">

    <header class="hero">
      <figure class="hero-media">
        <img src="shizilinbackground.jpg" alt="獅子林背景圖片">
      </figure>

      <a href="heritage-zh.html" class="return-home">← 回歸主頁</a>

      <h1 class="hero-title">獅子林</h1>

      <p class="hero-intro">
        位於江蘇蘇州的中國古典園林，以錯綜複雜的假山與迷宮般的佈局聞名。
      </p>
    </header>

    <section class="submissions">

      <article class="card">
        <div class="card-media">
          <img src="shizilin.jpg" alt="獅子林">
        </div>
        <div class="card-body">
          <h3 class="card-title">作者：Eliana Li</h3>
          <div class="card-meta">圖片來源：Eliana Li，蘇州園林（非獅子林實景）</div>
          <p class="card-intro clamp-3">
             <p>
              獅子林裡的每一塊石頭、每一個洞穴，都像是一張藏著寶藏的祕密地圖。假山結構精巧，沒有任何一條是死路，每一個入口都通往未知的領域。除了自然的框景設計，彩色窗櫺更為園林增添了生趣。從廳堂到亭臺再到石舫，窗戶設計各不相同，色彩繽紛，別具一格。
            </p>
            <p>
              攀爬假山時記得留意頭頂的石塊，曲折蜿蜒之間可別迷路！
            </p>
          </p>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
