<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>黄鹤楼 – Heritmap</title>
<style>
  :root{
    --card-radius: 22px;
    --page-max: 1100px;
    --gap: 1.25rem;
    --bg: #f7f7f7;
    --surface: #ffffff;
    --text: #141414;
    --muted: #666;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    color: var(--text);
    background: var(--bg);
    font-family: "Times New Roman", serif;
  }

  .page {
    max-width: var(--page-max);
    margin: 0 auto;
    padding: 24px 16px 56px;
  }

  .hero {
    display: grid;
    justify-items: center;
    text-align: center;
    gap: 16px;
    margin-bottom: 28px;
  }

  .hero-media {
    width: min(100%, 820px);
    aspect-ratio: 16/9;
    overflow: hidden;
    border-radius: var(--card-radius);
    background: #ddd;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
  }
  .hero-media img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .hero-title{
    font-size: clamp(28px, 5vw, 44px);
    line-height: 1.1;
    margin: 0;
    letter-spacing: 0.2px;
  }
  .hero-intro{
    max-width: 780px;
    font-size: clamp(15px, 2.4vw, 18px);
    color: var(--muted);
    margin: 6px 0 0;
  }

  .submissions {
    display: block;
    column-count: 3;
    margin-top: 28px;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: var(--gap);
    align-items: start;
  }

  .submissions .card {
    display: inline-block;
    width: 100%;
    margin: 0 0 28px;                  
    break-inside: avoid;
    -webkit-column-break-inside: avoid;
    -moz-column-break-inside: avoid;
  }

  .card {
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border-radius: var(--card-radius);
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
    overflow: hidden; 
    min-height: 280px;
    text-align: center;
  }

  .card-media{
    width: 100%;
    aspect-ratio: 4/3;
    overflow: hidden;
    background: #e9e9e9;
  }
  .card-media img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .card-body{
    display: grid;
    grid-template-rows: auto 1fr auto; 
    padding: 14px 14px 16px;
    gap: 8px;
  }

  .card-title{
    margin: 2px 0 0;
    font-size: 1.25rem; 
    line-height: 1.2;
    letter-spacing: .2px;
  }

  .card-meta{
    font-size: .85rem;
    color: var(--muted);
  }

  .card-intro{
    margin: 0;
    padding-top: 6px;
    font-size: .98rem; 
    color: var(--muted);
  }

  .card.no-image .card-body{
    padding-top: 18px;
  }

  .clamp-3 {
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .return-home {
    display: inline-block;
    margin-top: 10px;
    margin-bottom: 18px;
    font-size: 0.95rem;
    color: #444;
    text-decoration: none;
    transition: color 0.2s ease;
  }

  .return-home:hover {
    color: #000;
    text-decoration: underline;
  }
</style>
</head>
<body>
  <main class="page">

    <header class="hero">
      <figure class="hero-media">
        <img src="yellowcrane.jpg" alt="遗产地头图">
      </figure>

      <a href="heritage-zh.html" class="return-home">← 回归主页</a>

      <h1 class="hero-title">黄鹤楼</h1>

      <p class="hero-intro">
        武汉长江之畔的名楼，千百年来在中国诗词与文化中被反复歌咏。
      </p>
    </header>

    <section class="submissions">

      <article class="card">
        <div class="card-body">
          <h3 class="card-title">作者：谭贺军</h3>
          <p class="card-intro clamp-3">
            <p>
              在四年级暑假，我与爸爸去黄鹤楼游玩，其独特的四边翘八边形设计，使楼体既显雄浑大气，又不失精巧灵动。飞檐五层，攒尖楼顶，金色琉璃瓦屋面在阳光照耀下熠熠生辉。60个翘角向外伸展，宛如黄鹤展翅欲飞。
            </p>
            <p>
              当我爬上六楼时，我从上往下看，看到了滚滚长江向前流淌，对岸与四周的高楼大厦如树林一般层层叠叠，与黄鹤楼形成了鲜明的对比。
            </p>
            <p>
              黄鹤楼建于三国时期，重建了数十次。我希望能够保护这座历史悠久的楼，每年定期修理，不随意乱画乱刻，提倡大家一起保护，让黄鹤楼重现它最初的样子。
            </p>
          </p>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
